<div class="row">
    <div class="col-md-2"></div>
    <div class="col-md-8">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" routerLink="">Mini E-Commerce</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" routerLink="">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" routerLink="products">Products</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" routerLink="basket">Basket</a>
                        </li>
                    </ul>
                    <form class="d-flex me-3" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                        <button class="btn btn-outline-primary" type="submit">Search</button>
                    </form>
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="btn btn-outline-info me-2" routerLink="admin"
                                *ngIf="authService.isAuthenticated">Admin</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-outline-danger me-2" routerLink="" (click)="logout()"
                                *ngIf="authService.isAuthenticated">Logout</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-outline-success me-2" routerLink="register"
                                *ngIf="!authService.isAuthenticated">Register</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-outline-warning" routerLink="login"
                                *ngIf="!authService.isAuthenticated">Login</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>
    <div class="col-md-2"></div>
</div>

<router-outlet></router-outlet>

<ngx-spinner size="default" name="s1" type="ball-fussion"></ngx-spinner>
<ngx-spinner size="default" name="s2" type="ball-spin-clockwise-fade-rotating"></ngx-spinner>
<ngx-spinner size="default" name="s3" type="timer"></ngx-spinner>
