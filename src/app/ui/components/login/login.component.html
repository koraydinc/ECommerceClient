<div>
    <div class="row">
        <div class="col-md-4"></div>
        <div class="col-md-4">
            <div class="mb-3 text-line">
                <label for="inputUsername" class="form-label">Username & Email</label>
                <input #txtUsernameOrEmail type="username" class="form-control" id="inputUsername"
                    aria-describedby="usernameWarning">
                <div *ngIf="showUsernameWarning" id="usernameWarning" class="form-text warning-message">Username is
                    required!</div>
            </div>
            <div class="mb-3 text-line">
                <label for="inputPassword" class="form-label">Password</label>
                <input #txtPassword type="password" class="form-control" id="inputPassword"
                    aria-describedby="passwordWarning">
                <div *ngIf="showPasswordWarning" id="passwordWarning" class="form-text warning-message">Password is
                    required!</div>
            </div>

            <div class="button-container">
                <button type="submit" class="btn btn-primary login-btn"
                    (click)="login(txtUsernameOrEmail.value,txtPassword.value)">Login</button>
                <asl-google-signin-button class="google-btn" (click)="googleLogin()"></asl-google-signin-button>
            </div>
        </div>
        <div class="col-md-4"></div>
    </div>
</div>
